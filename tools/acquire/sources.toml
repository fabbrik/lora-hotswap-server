# The artifact set for the lora-hotswap-server, declared as data so that later
# stories (1.3 conversion, 1.5 validation) can read it without parsing a script.
#
# `target` is relative to the repository root (lora-hotswap-server/).
# `files` is explicit on purpose: `ggml-org/Qwen3-0.6B-GGUF` publishes several
# quantisations and a snapshot download would drag gigabytes nobody asked for.
#
# Base-model quantisation: Q8_0 (~805 MB, near-lossless) chosen for CPU-only
# Apple Silicon. The repo also ships BF16 / f16 (~1.5 GB) and Q4_0 (~429 MB).

[[artifact]]
name = "base-qwen3-0.6b-gguf"
kind = "base-model"
repo_id = "ggml-org/Qwen3-0.6B-GGUF"
target = "models/Qwen3-0.6B-GGUF"
files = ["Qwen3-0.6B-Q8_0.gguf"]

# The demo adapters. All Apache-2.0 on the Hub (checked 2026-10-23), so the whole
# demonstration is redistributable. Only the two files every downstream story needs are
# fetched: the PEFT weights and their config. Tokenizer/optimizer/trainer state in these
# repos is not used by this project.
#
# They differ on purpose: different targets (q/v only vs all projections), different
# rank/alpha, and one rsLoRA adapter, so alpha/r vs alpha/sqrt(r) is exercised on
# published weights and not only on the synthetic fixtures.

[[artifact]]
name = "Qwen3-0.6B-nlp-to-sql"
kind = "adapter"
repo_id = "gauravprasadgp/Qwen3-0.6B_nlp_to_sql"
target = "adapters/Qwen3-0.6B-nlp-to-sql"
files = ["adapter_config.json", "adapter_model.safetensors"]

[[artifact]]
name = "Qwen3-0.6B-alpaca-lora"
kind = "adapter"
repo_id = "Threatthriver/qwen3-0.6b-alpaca-lora"
target = "adapters/Qwen3-0.6B-alpaca-lora"
# The repo also holds checkpoint-N/ directories; only the final adapter is taken.
files = ["adapter_config.json", "adapter_model.safetensors"]

[[artifact]]
name = "Qwen3-0.6B-TLDR-Lora"
kind = "adapter"
repo_id = "phh/Qwen3-0.6B-TLDR-Lora"
target = "adapters/Qwen3-0.6B-TLDR-Lora"
# The repo also ships a pre-converted .gguf. Deliberately not taken: Story 1.3
# owns conversion and its provenance manifest.
files = ["adapter_config.json", "adapter_model.safetensors"]

[[artifact]]
name = "Qwen3-0.6B-clinical-lora"
kind = "adapter"
repo_id = "cloudkites/qwen3-0.6b-clinical-lora"
target = "adapters/Qwen3-0.6B-clinical-lora"
# use_rslora = true: scaling is alpha/sqrt(r), not alpha/r.
files = ["adapter_config.json", "adapter_model.safetensors"]
